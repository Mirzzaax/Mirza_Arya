<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Coffe Fineshyt</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">

  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">☕</div>
      <h1>Coffe Fineshyt</h1>
      <p>Sistem Kasir Modern</p>
    </div>

    <h2 class="auth-title">Masuk ke Sistem</h2>

    <!-- Form Login -->
    <form action="index.html" method="get">

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input
          class="form-control"
          type="email"
          id="email"
          name="email"
          placeholder="email@contoh.com"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          class="form-control"
          type="password"
          id="password"
          name="password"
          placeholder="Masukkan password Anda"
          required
        />
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:.6rem;">
        <input type="checkbox" id="ingat" name="ingat" style="width:16px; height:16px; accent-color: var(--caramel); cursor:pointer;" />
        <label for="ingat" style="font-size:.88rem; color:var(--text-mid); cursor:pointer;">Ingat saya di perangkat ini</label>
      </div>

      <a href="index.html" class="btn-primary">Masuk</a>
    </form>

    <div class="auth-footer">
      Belum punya akun? <a href="register.html">Daftar sekarang</a>
    </div>
    <div class="auth-footer" style="margin-top:.5rem;">
      <a href="#" style="color:var(--text-light); font-size:.82rem;">Lupa password?</a>
    </div>
  </div>

</body>
</html>
