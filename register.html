<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Akun — Coffe Fineshyt</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">

  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">☕</div>
      <h1>Coffe Fineshyt</h1>
      <p>Sistem Kasir Modern</p>
    </div>

    <h2 class="auth-title">Buat Akun Baru</h2>

    <!-- Form Register -->
    <form action="login.html" method="get">

      <div class="form-group">
        <label class="form-label" for="nama">Nama Lengkap</label>
        <input
          class="form-control"
          type="text"
          id="nama"
          name="nama"
          placeholder="Contoh: Andi Prasetyo"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input
          class="form-control"
          type="email"
          id="email"
          name="email"
          placeholder="email@contoh.com"
          required
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="role">Jabatan</label>
          <select class="form-control" id="role" name="role" required>
            <option value="" disabled selected>Pilih jabatan</option>
            <option value="kasir">Kasir</option>
            <option value="manajer">Manajer</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="telepon">No. Telepon</label>
          <input
            class="form-control"
            type="tel"
            id="telepon"
            name="telepon"
            placeholder="08xxxxxxxxxx"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          class="form-control"
          type="password"
          id="password"
          name="password"
          placeholder="Minimal 8 karakter"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="konfirmasi">Konfirmasi Password</label>
        <input
          class="form-control"
          type="password"
          id="konfirmasi"
          name="konfirmasi"
          placeholder="Ulangi password"
          required
        />
      </div>

      <a href="login.html" class="btn-primary">Daftar Sekarang</a>
    </form>

    <div class="auth-footer">
      Sudah punya akun? <a href="login.html">Masuk di sini</a>
    </div>
  </div>

</body>
</html>
